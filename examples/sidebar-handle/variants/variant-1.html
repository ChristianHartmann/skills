<!-- Variant 1: floating pill on the divider.

     Only the body - markup, a <style> for what is specific to this variant, a
     <script> for the behaviour. Tokens and Editor.module.css are prepended by
     show_variants.py, so the class names below are the real ones. -->

<div class="shell" id="shell">
  <div class="rail" id="rail" hidden>
    <div class="railDot"></div>
    <div class="railDot"></div>
    <div class="railDot"></div>
  </div>

  <div class="panel" id="panel">
    <div class="panelHeader">Layers</div>
    <div class="panelBody">
      <div class="layerRow selected"><span class="swatch"></span>Background</div>
      <div class="layerRow"><span class="swatch"></span>Sketch</div>
      <div class="layerRow"><span class="swatch"></span>Annotations</div>
    </div>
  </div>

  <button class="handle" id="handle" aria-expanded="true" aria-controls="panel">
    <span class="chevron" id="chevron">‹</span>
    <span class="sr-only">Collapse panel</span>
  </button>

  <div class="canvas">Canvas</div>
</div>

<style>
  html, body { height: 100%; }
  .shell { position: relative; height: 100%; }

  /* The handle sits on the boundary itself, straddling it, and moves with the
     edge when the panel collapses. */
  .handle {
    position: absolute;
    top: 50%;
    left: calc(var(--panel-width) - 11px);
    transform: translateY(-50%);
    width: 22px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    background: var(--surface);
    box-shadow: var(--shadow-raised);
    color: var(--text-muted);
    cursor: pointer;
    font: inherit;
    font-size: 15px;
    transition: left 160ms ease;
  }
  .handle:hover { color: var(--text); }
  .handle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell.collapsed .handle { left: calc(var(--rail-width) - 11px); }
  .chevron { display: block; transition: transform 160ms ease; }
  .shell.collapsed .chevron { transform: rotate(180deg); }
</style>

<script>
  const shell = document.getElementById('shell');
  const panel = document.getElementById('panel');
  const rail = document.getElementById('rail');
  const handle = document.getElementById('handle');

  handle.addEventListener('click', () => {
    const collapsed = shell.classList.toggle('collapsed');
    // The real component removes the panel from the DOM rather than hiding it,
    // so the rebuild does the same - hiding it leaves the header overlapping
    // the rail in the collapsed state.
    panel.hidden = collapsed;
    rail.hidden = !collapsed;
    handle.setAttribute('aria-expanded', String(!collapsed));
    handle.querySelector('.sr-only').textContent = collapsed
      ? 'Expand panel'
      : 'Collapse panel';
  });
</script>
